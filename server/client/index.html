<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/static/style.css">
  <title>SecureChat</title>
  <style>
    body { margin:0; padding:0; font-family:Arial,sans-serif; background:#f2f2f2; overflow:hidden; }    #loginScreen, #chatScreen { width:100%; height:100vh; display:flex; justify-content:center; align-items:center; }
    #loginBox { background:white; padding:25px; border-radius:8px; box-shadow:0 0 10px #ccc; width:300px; }
    #chatScreen { display:none; flex-direction:column; height:100vh; width:100%; position:fixed; top:0; left:0; margin:0; padding:0; }    #logoutBtn { padding:6px 12px; background:#e74c3c; color:white; border:none; border-radius:4px; cursor:pointer; font-size:13px; font-weight:bold; }
    #logoutBtn:hover { background:#c0392b; }
    #mainArea { display:flex; flex:1; overflow:hidden; width:100%; }    #onlinePanel { width:140px; background:#fff; border-right:1px solid #ccc; padding:10px; }    #onlinePanel h3 { font-size:13px; color:#555; margin-bottom:6px; }
    #onlineList { list-style:none; padding:0; margin:0; }
    #onlineList li { padding:6px 8px; border-radius:4px; cursor:pointer; }
    #onlineList li:hover { background:#f0f0f0; }
    #onlineList li.active { background:#e3f0ff; color:#0078ff; font-weight:bold; }
    #messages { flex:1; padding:15px; overflow-y:auto; background:#f9f9f9; min-height:0; }    .msg { background:#d9ecff; padding:10px; margin-bottom:10px; border-radius:6px; max-width:70%; }
    .msg.me { background:#c8ffd4; margin-left:auto; }
    .system { text-align:center; color:#666; font-size:14px; margin:10px 0; }
    #typingIndicator { padding:5px 15px; color:#666; font-size:14px; height:20px; }
    #inputBar { display:flex; padding:10px; background:#fff; border-top:1px solid #ccc; align-items:center; gap:6px; }
    #msgInput { flex:1; padding:10px; font-size:16px; }
    #sendBtn { padding:10px 20px; background:#0078ff; color:white; border:none; cursor:pointer; border-radius:4px; }
    #registerBtn { width:100%; padding:8px; background:#28a745; color:white; border:none; border-radius:4px; cursor:pointer; margin-top:6px; }
    /* Red border validation */
    .field-error { border:2px solid #e74c3c !important; }
    .err-msg { color:#e74c3c; font-size:11px; margin:2px 0 6px; display:none; }
    .online-dot {
      display:inline-block;
      width:8px;
      height:8px;
      border-radius:50%;
      margin-right:6px;
      background:#28a745;
    }
    .offline-dot {
      display:inline-block;
      width:8px;
      height:8px;
      border-radius:50%;
      margin-right:6px;
      background:#ccc;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <button id="bgToggle" style="display:none;">Switch</button>
<div id="loginScreen">
  <div id="loginBox">
    <h2 style="text-align:center;">SecureChat Login</h2>
    <input id="user" placeholder="Username" style="width:100%;padding:10px;margin-bottom:2px;box-sizing:border-box;border-radius:4px;border:1px solid #ccc;">
    <div class="err-msg" id="userErr">Please enter a username</div>
    <input id="pass" type="password" placeholder="Password" style="width:100%;padding:10px;margin-top:12px;margin-bottom:2px;box-sizing:border-box;border-radius:4px;border:1px solid #ccc;">
    <div class="err-msg" id="passErr">Please enter a password</div>
    <button id="loginBtn" style="width:100%;padding:10px;background:#0078ff;color:white;border:none;border-radius:4px;cursor:pointer;margin-top:8px;">Login</button>
    <p style="text-align:center;margin:10px 0 0;font-size:13px;color:#555;">
      No account? <a href="#" id="goRegister">Create one</a>
    </p>
  </div>
</div>

<!-- Register screen -->
<div id="registerScreen" style="display:none;width:100%;height:100vh;justify-content:center;align-items:center;">
  <div id="loginBox">
    <h2 style="text-align:center;">Create Account</h2>
    <input id="regUser" placeholder="Username" style="width:100%;padding:8px;margin-bottom:2px;box-sizing:border-box;">
    <div class="err-msg" id="regUserErr">Please enter a username</div>
    <input id="regPass" type="password" placeholder="Password" style="width:100%;padding:8px;margin-bottom:2px;box-sizing:border-box;">
    <p style="font-size:11px;color:#888;margin:0 0 2px;">Min 8 chars, 1 uppercase, 1 number, 1 special character (!@#$%^&*)</p>
    <div class="err-msg" id="regPassErr"></div>
    <input id="regPass2" type="password" placeholder="Confirm password" style="width:100%;padding:8px;margin-bottom:2px;box-sizing:border-box;">
    <div class="err-msg" id="regPass2Err">Passwords do not match</div>
    <button id="registerBtn" style="width:100%;padding:10px;background:#28a745;color:white;border:none;border-radius:4px;cursor:pointer;margin-top:8px;">Create Account</button>
    <p style="text-align:center;margin:10px 0 0;font-size:13px;color:#555;">
      Already have an account? <a href="#" id="goLogin">Log in</a>
    </p>
  </div>
</div>

<div id="chatScreen">
  <div id="topBar">
    <span id="topBarTitle">SecureChat</span>
    <button id="logoutBtn">Logout</button>
  </div>

  <div id="mainArea">
    <div id="onlinePanel">
      <h3>Online — click to chat</h3>
      <ul id="onlineList"></ul>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;">
      <div id="messages"></div>
      <div id="typingIndicator"></div>

      <div id="inputBar">
        <input id="fileInput" type="file" style="margin-right:8px;">
        <button id="emojiBtn">😊</button>
        <button id="boldBtn"><b>B</b></button>
        <button id="italicBtn"><i>I</i></button>
        <input id="msgInput" placeholder="Type a message...">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>


<script src="/static/main.js"></script>
</body>
</html>
